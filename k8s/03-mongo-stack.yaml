# =============================================================================
# 03-mongo-stack.yaml
# Capa de datos: PVC + Deployment de MongoDB + Service ClusterIP (S08 | AP6)
# -----------------------------------------------------------------------------
# Tres recursos en un solo archivo, separados por "---":
#   1. PersistentVolumeClaim -> almacenamiento para que los datos sobrevivan a reinicios del Pod
#   2. Deployment            -> ejecuta el Pod de MongoDB
#   3. Service (ClusterIP)   -> IP interna estable; MongoDB NO es accesible desde fuera del clúster
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  namespace: practica-s08
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: practica-s08
spec:
  accessModes:
    - ReadWriteOnce               # Un solo nodo monta el volumen en lectura/escritura (suficiente en Minikube)
  resources:
    requests:
      storage: 1Gi                # Minikube aprovisiona el volumen con su StorageClass "standard" por defecto
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
  namespace: practica-s08
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: practica-s08
    app.kubernetes.io/component: database
spec:
  replicas: 1                     # Instancia única: MongoDB standalone (sin replica set) para el laboratorio
  strategy:
    type: Recreate                # El volumen es ReadWriteOnce: se elimina el Pod viejo ANTES de crear el nuevo
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo   # El Deployment gestiona los Pods con esta etiqueta
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo # Debe coincidir con selector.matchLabels y con el selector del Service
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: mongo
          image: mongo:7.0        # Versión fija (evita sorpresas de ":latest")
          ports:
            - containerPort: 27017   # Puerto estándar de MongoDB
              name: mongo
          env:
            # Con estas dos variables la imagen oficial crea el usuario root al
            # inicializar un volumen VACÍO. Los valores vienen del Secret: no
            # existe ninguna credencial escrita en este manifiesto.
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret       # Secret definido en 02-db-secret.yaml
                  key: DB_USER          # Clave dentro del Secret
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASS
            # Nombre de la base de datos inicial; se toma del ConfigMap para que
            # MongoDB y el backend siempre compartan el mismo valor (fuente única).
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config      # ConfigMap definido en 01-app-configmap.yaml
                  key: DB_NAME
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db       # Directorio donde MongoDB guarda sus datos
          readinessProbe:               # ¿Está listo para recibir tráfico? (controla los endpoints del Service)
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:                # ¿Sigue vivo? Si falla repetidamente, kubelet reinicia el contenedor
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:                    # Requests = reserva mínima; limits = tope máximo
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-pvc        # Enlaza el volumen con el PVC declarado arriba
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service             # ESTE nombre es el valor de DB_HOST en el ConfigMap (resolución DNS interna)
  namespace: practica-s08
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: practica-s08
spec:
  type: ClusterIP                 # Solo accesible dentro del clúster (es el valor por defecto; se explicita a propósito)
  selector:
    app.kubernetes.io/name: mongo # Envía el tráfico a los Pods con esta etiqueta
  ports:
    - name: mongo
      port: 27017                 # Puerto del Service
      targetPort: 27017           # Puerto del contenedor
      protocol: TCP
